spring.application.name=Enterprise-Resource-Planning-Test

spring.datasource.url=jdbc:h2:mem:erp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties[hibernate.jdbc.time_zone]=UTC

app.jwt.secret=TestSecretWithMoreThanThirtyTwoCharacters
app.jwt.expiration-minutes=60
app.seed-demo-data=true

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=test@example.com
